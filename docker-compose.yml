# Loreforge – pull-and-run. No clone or build needed: copy this file anywhere and run
#   docker compose up -d
# The image is published by .github/workflows/docker.yml on every push to main.
# To build from source instead: docker compose -f docker-compose.build.yml up -d --build
services:
  loreforge:
    image: ghcr.io/stanleymejia/loreforge:latest
    container_name: loreforge
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Public URL you reach the app on. Required for form submissions to be accepted.
      ORIGIN: http://localhost:3000
      # Behind a reverse proxy (Traefik, Caddy, nginx, NPM) uncomment these two:
      # PROTOCOL_HEADER: x-forwarded-proto
      # HOST_HEADER: x-forwarded-host
      # --- Uploads. Images are stored under /data/uploads (inside the volume).
      # MAX_UPLOAD_MB: 10                          # per-file limit; BODY_SIZE_LIMIT (25M) must stay above it
      # --- Single sign-on (optional). Leave unset for an open instance on a trusted LAN.
      # OIDC_ISSUER: https://id.example.lan          # Pocket ID base URL
      # OIDC_CLIENT_ID: loreforge
      # OIDC_CLIENT_SECRET: change-me                # omit for a public (PKCE-only) client
      # OIDC_PROVIDER_NAME: Pocket ID                # label on the login button
      # AUTH_ALLOWED_EMAILS: you@example.lan         # comma-separated allowlist (optional)
      # AUTH_ALLOWED_GROUPS: writers                 # requires the 'groups' scope/claim (optional)
    volumes:
      # SQLite database (WAL mode). Named volume: ownership is set up automatically.
      - loreforge-data:/data
      # Prefer a bind mount? The container runs as uid 1000, so create the directory first:
      #   mkdir -p ./data && sudo chown 1000:1000 ./data
      # - ./data:/data

volumes:
  loreforge-data:
